name: Security Assessment

# ─────────────────────────────────────────────────────────────────────────────
#  Reusable security-assessment pipeline (SAST + secret scanning).
#  Generic — works on ANY codebase. No compliance audit. No LLM / API keys.
#
#  Use from another repository:
#
#    jobs:
#      security:
#        uses: TheWildEye/MrHunter2/.github/workflows/security-assessment.yml@main
#        with:
#          exclude-paths: "tests,fixtures,node_modules"
#
#  Or call it locally (same repo):
#
#    jobs:
#      security:
#        uses: ./.github/workflows/security-assessment.yml
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      exclude-paths:
        description: "Comma-separated paths to skip during scanning (any repo can pass its own)."
        required: false
        type: string
        default: "node_modules,vendor,dist,build,.git"
      semgrep-config:
        description: "Semgrep ruleset(s), e.g. 'p/security-audit' or 'auto'."
        required: false
        type: string
        default: "p/security-audit"

permissions:
  contents: read
  pull-requests: write

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SAST (Semgrep)
        run: |
          set -e
          python3 -m pip install --quiet semgrep
          EXCLUDES=""
          IFS=',' read -ra PATHS <<< "${{ inputs.exclude-paths }}"
          for p in "${PATHS[@]}"; do
            p="$(echo "$p" | xargs)"
            [ -n "$p" ] && EXCLUDES="$EXCLUDES --exclude $p"
          done
          semgrep scan --config ${{ inputs.semgrep-config }} --error $EXCLUDES
          echo "SAST scan clean"
