<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="8" viewBox="0 0 1200 8">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff41" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#00ff9c" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00c853" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff41" stop-opacity="0"/>
      <stop offset="0.65" stop-color="#00ff41" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#aaffcc" stop-opacity="1"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-500%" width="160%" height="1100%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="3" width="1200" height="2" fill="url(#base)"/>

  <g filter="url(#glow)">
    <rect x="-280" y="3" width="280" height="2" fill="url(#trail)">
      <animate attributeName="x" from="-280" to="1200" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <circle cy="4" r="3" fill="#eaffef">
      <animate attributeName="cx" from="-280" to="1200" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.9" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
