<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif">
  <defs>
    <filter id="sh" x="-5%" y="-20%" width="110%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="998" height="538" rx="18" fill="#f8fafc" stroke="#e6e8eb"/>

  <!-- review 1 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.93;1" dur="14s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 14;0 0;0 0;0 14" keyTimes="0;0.05;0.93;1" dur="14s" repeatCount="indefinite"/>
    <rect x="92" y="34" width="872" height="94" rx="16" fill="#ffffff" stroke="#e8ebef" filter="url(#sh)"/>
    <circle cx="52" cy="72" r="24" fill="#0969da"/>
    <text x="52" y="78" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">K</text>
    <text x="116" y="66" font-size="16"><tspan fill="#0f172a" font-weight="700">Kushal</tspan><tspan fill="#64748b" dx="9">Data Scientist</tspan></text>
    <text x="940" y="66" fill="#f59e0b" font-size="14" text-anchor="end">&#9733;&#9733;&#9733;&#9733;&#9733;</text>
    <text x="116" y="96" fill="#334155" font-size="15">Used this in my daily work. It did the work of 2 people, and I got a hike.</text>
  </g>

  <!-- review 2 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.13;0.93;1" dur="14s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 14;0 0;0 0;0 14" keyTimes="0;0.13;0.93;1" dur="14s" repeatCount="indefinite"/>
    <rect x="92" y="144" width="872" height="112" rx="16" fill="#ffffff" stroke="#e8ebef" filter="url(#sh)"/>
    <circle cx="52" cy="182" r="24" fill="#8250df"/>
    <text x="52" y="188" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">M</text>
    <text x="116" y="176" font-size="16"><tspan fill="#0f172a" font-weight="700">Meet</tspan><tspan fill="#64748b" dx="9">Team Lead</tspan></text>
    <text x="940" y="176" fill="#f59e0b" font-size="14" text-anchor="end">&#9733;&#9733;&#9733;&#9733;&#9733;</text>
    <text x="116" y="206" fill="#334155" font-size="15">Vyom built this in my team and it scaled up so well. We were having a nightmare</text>
    <text x="116" y="230" fill="#334155" font-size="15">with so many issues, now we are fully confident about our security. Proud of you Vyom.</text>
  </g>

  <!-- review 3 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.21;0.93;1" dur="14s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 14;0 0;0 0;0 14" keyTimes="0;0.21;0.93;1" dur="14s" repeatCount="indefinite"/>
    <rect x="92" y="272" width="872" height="94" rx="16" fill="#ffffff" stroke="#e8ebef" filter="url(#sh)"/>
    <circle cx="52" cy="310" r="24" fill="#1a7f37"/>
    <text x="52" y="316" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">K</text>
    <text x="116" y="304" font-size="16"><tspan fill="#0f172a" font-weight="700">Karan</tspan><tspan fill="#64748b" dx="9">Senior AI Engineer</tspan></text>
    <text x="940" y="304" fill="#f59e0b" font-size="14" text-anchor="end">&#9733;&#9733;&#9733;&#9733;&#9733;</text>
    <text x="116" y="334" fill="#334155" font-size="15">Subah subah kaam badha deta hai ye tool. Just kidding, great work Vyom!</text>
  </g>

  <!-- review 4 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.29;0.93;1" dur="14s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 14;0 0;0 0;0 14" keyTimes="0;0.29;0.93;1" dur="14s" repeatCount="indefinite"/>
    <rect x="92" y="382" width="872" height="94" rx="16" fill="#ffffff" stroke="#e8ebef" filter="url(#sh)"/>
    <circle cx="52" cy="420" r="24" fill="#bf3989"/>
    <text x="52" y="426" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">C</text>
    <text x="116" y="414" font-size="16"><tspan fill="#0f172a" font-weight="700">Chintan</tspan><tspan fill="#64748b" dx="9">Team Lead, Operations</tspan></text>
    <text x="940" y="414" fill="#f59e0b" font-size="14" text-anchor="end">&#9733;&#9733;&#9733;&#9733;&#9733;</text>
    <text x="116" y="444" fill="#334155" font-size="15">How are you finding so many vulnerabilities? Give us some time to fix them haha.</text>
  </g>
</svg>
