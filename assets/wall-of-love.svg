<svg xmlns="http://www.w3.org/2000/svg" width="900" height="486" viewBox="0 0 900 486" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f8fa"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="898" height="484" rx="18" fill="url(#panel)" stroke="#d0d7de"/>

  <!-- Kushal -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.92;1" dur="12s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 26;0 0;0 0;0 26" keyTimes="0;0.06;0.92;1" dur="12s" repeatCount="indefinite"/>
    <circle cx="46" cy="54" r="21" fill="#0969da"/>
    <text x="46" y="60" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">K</text>
    <rect x="84" y="18" width="792" height="72" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="106" y="46" fill="#0969da" font-size="15" font-weight="700">Kushal &#183; Data Scientist</text>
    <text x="106" y="72" fill="#24292f" font-size="15">Used this in my daily work. It did the work of 2 people, and I got a hike.</text>
  </g>

  <!-- Meet -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.14;0.92;1" dur="12s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 26;0 0;0 0;0 26" keyTimes="0;0.14;0.92;1" dur="12s" repeatCount="indefinite"/>
    <circle cx="46" cy="162" r="21" fill="#8250df"/>
    <text x="46" y="168" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">M</text>
    <rect x="84" y="126" width="792" height="96" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="106" y="154" fill="#8250df" font-size="15" font-weight="700">Meet &#183; Team Lead</text>
    <text x="106" y="180" fill="#24292f" font-size="15">Vyom built this in my team and it scaled up so well. We were having a nightmare</text>
    <text x="106" y="204" fill="#24292f" font-size="15">with so many issues, now we are fully confident about our security. Proud of you Vyom.</text>
  </g>

  <!-- Karan -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.22;0.92;1" dur="12s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 26;0 0;0 0;0 26" keyTimes="0;0.22;0.92;1" dur="12s" repeatCount="indefinite"/>
    <circle cx="46" cy="292" r="21" fill="#1a7f37"/>
    <text x="46" y="298" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">K</text>
    <rect x="84" y="256" width="792" height="72" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="106" y="284" fill="#1a7f37" font-size="15" font-weight="700">Karan &#183; Senior AI Engineer</text>
    <text x="106" y="310" fill="#24292f" font-size="15">Subah subah kaam badha deta hai ye tool. Just kidding, great work Vyom!</text>
  </g>

  <!-- Chintan -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.30;0.92;1" dur="12s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 26;0 0;0 0;0 26" keyTimes="0;0.30;0.92;1" dur="12s" repeatCount="indefinite"/>
    <circle cx="46" cy="422" r="21" fill="#bf3989"/>
    <text x="46" y="428" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">C</text>
    <rect x="84" y="386" width="792" height="72" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="106" y="414" fill="#bf3989" font-size="15" font-weight="700">Chintan &#183; Team Lead, Operations</text>
    <text x="106" y="440" fill="#24292f" font-size="15">How are you finding so many vulnerabilities Vyom, give us some time to fix them haha!</text>
  </g>
</svg>
