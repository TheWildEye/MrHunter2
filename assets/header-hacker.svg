<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" font-family="'Courier New',Consolas,monospace">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04070b"/>
      <stop offset="1" stop-color="#0a121a"/>
    </linearGradient>
    <linearGradient id="hwave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff41"/>
      <stop offset="0.5" stop-color="#00ff9c"/>
      <stop offset="1" stop-color="#00c853"/>
    </linearGradient>
    <filter id="hglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="330" fill="url(#hbg)"/>

  
  <g stroke="#0d2a1c" stroke-width="1" opacity="0.55">
    <line x1="0" y1="66" x2="1280" y2="66"/><line x1="0" y1="132" x2="1280" y2="132"/>
    <line x1="0" y1="198" x2="1280" y2="198"/><line x1="0" y1="264" x2="1280" y2="264"/>
    <line x1="160" y1="0" x2="160" y2="330"/><line x1="320" y1="0" x2="320" y2="330"/>
    <line x1="480" y1="0" x2="480" y2="330"/><line x1="640" y1="0" x2="640" y2="330"/>
    <line x1="800" y1="0" x2="800" y2="330"/><line x1="960" y1="0" x2="960" y2="330"/>
    <line x1="1120" y1="0" x2="1120" y2="330"/>
  </g>

  
  <g fill="#0e3a24" font-size="13" opacity="0.9">
    <text x="18" y="34">0x1f 1010 $ grep -r secret</text>
    <text x="470" y="22">SELECT * FROM users</text>
    <text x="980" y="40">sudo ./scan --deep</text>
    <text x="120" y="112">{"role":"admin"}</text>
    <text x="1040" y="120">DROP TABLE</text>
    <text x="20" y="300">CWE-89 CWE-79 CWE-502</text>
    <text x="1010" y="300">DPDP PCI-DSS CERT-IN</text>
    <text x="560" y="300">access_token=****</text>
  </g>

  
  <rect x="0" y="-80" width="1280" height="80" fill="#00ff41" opacity="0.06">
    <animate attributeName="y" from="-80" to="330" dur="6s" repeatCount="indefinite"/>
  </rect>

  
  <text x="640" y="150" fill="#00ff41" font-size="104" font-weight="bold" text-anchor="middle" filter="url(#hglow)" letter-spacing="4">MrHunter
    <animate attributeName="opacity" values="1;1;0.55;1;1;1;0.8;1" keyTimes="0;0.86;0.88;0.9;0.92;0.95;0.97;1" dur="5s" repeatCount="indefinite"/>
  </text>
  <rect x="893" y="86" width="20" height="60" fill="#00ff41" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.9;0;0;0.9" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  
  <text x="640" y="200" fill="#2fd968" font-size="21" text-anchor="middle" letter-spacing="1">AI-Powered Security &amp; Compliance Agent</text>
  <text x="640" y="232" fill="#1c6b3e" font-size="14" text-anchor="middle">SAST &#183; DAST SIMULATION &#183; SECRETS &#183; ISO 27001 &#183; NIST &#183; DPDP &#183; PCI DSS &#183; CERT-IN</text>

  
  <path fill="url(#hwave)" opacity="0.9" d="M0,300 Q320,278 640,296 T1280,286 L1280,330 L0,330 Z">
    <animate attributeName="d" dur="9s" repeatCount="indefinite"
      values="M0,300 Q320,278 640,296 T1280,286 L1280,330 L0,330 Z;M0,306 Q320,292 640,304 T1280,296 L1280,330 L0,330 Z;M0,298 Q320,282 640,292 T1280,302 L1280,330 L0,330 Z;M0,300 Q320,278 640,296 T1280,286 L1280,330 L0,330 Z"/>
  </path>
</svg>
